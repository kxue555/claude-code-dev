# 评论里的修法：WebSocket 模式下请求会丢掉 model，网关就返回
# Unsupported model (empty)。改走 HTTPS（supports_websockets = false），
# 并显式写上 {provider}/{model}。
# 不用 azure_openai/gpt-5.2-codex（评论：费用太高，不让用）。
# 模型用 Jie Yu 评论里的 ppio/pa/gpt-5.5；地址用回复里确认的 Mify 网关。
# provider 相关键要放在用户级 ~/.codex/config.toml，项目级 .codex/config.toml 会被忽略。

model = "ppio/pa/gpt-5.5"
model_provider = "openai_http"
model_reasoning_effort = "high"

model_reasoning_summary = "detailed"
model_verbosity = "high"
model_supports_reasoning_summaries = true
model_reasoning_summary_format = "experimental"
model_context_window = 272000

# 走 Mify 时关掉内置 web search，否则非直连 OpenAI 会报错
web_search = "disabled"

[features]
apply_patch_freeform = false

[agents]
default_subagent_model = "deepseek/deepseek-flash"

[model_providers.openai_http]
name = "OpenAI HTTP only"
base_url = "https://api.llm.mioffice.cn/v1"
wire_api = "responses"
supports_websockets = false
requires_openai_auth = true
request_max_retries = 4
stream_max_retries = 10
stream_idle_timeout_ms = 300000
